name: CI Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic tomli typer rich

      - name: Python Syntax & Compilation Check
        run: |
          python -m compileall src

      - name: Shell Scripts Syntax Check
        run: |
          bash -n install.sh
          bash -n diagnose.sh
          bash -n status.sh
          bash -n clean-install.sh
          bash -n repair.sh
          bash -n uninstall.sh
