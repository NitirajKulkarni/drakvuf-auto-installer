# Xen HVM Domain Configuration for DRAKVUF Windows Guest
# Author: Nitiraj Kulkarni

type = "hvm"
name = "win10-drakvuf"
memory = 4096
vcpus = 2
vif = [ 'bridge=xenbr0' ]
disk = [
    'format=raw,vdev=xvda,access=w,target=/var/lib/drakvuf/images/win10.img'
]
boot = "c"
vnc = 1
vnclisten = "127.0.0.1"
vncdisplay = 0
serial = 'pty'
pae = 1
acpi = 1
apic = 1
viridian = 1
altp2m = 1
nestedhvm = 0
